version = 0.1
[default.deploy.parameters]
stack_name = "parks-test-cap-alerts-aggregator"
# Bucket is created outside the stack: artifacts must exist before CloudFormation runs.
# Do not run `sam deploy --guided`: it silently resets this to 'true' and bootstraps 'aws-sam-cli-managed-default'.
resolve_s3 = false
s3_bucket = "parks-test-cap-alerts-aggregator-artifacts"
s3_prefix = "parks-test-cap-alerts-aggregator"
region = "ap-southeast-2"
profile = "parks-sam-manager"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "AllowedOrigins=\"http://localhost:8000,http://127.0.0.1:8000,https://learn.anbg.gov.au,https://visit.anbg.gov.au,https://australianmarineparks.gov.au,https://booderee.gov.au,https://christmasislandnationalpark.gov.au,https://parksaustralia.gov.au,https://kakadu.gov.au,https://norfolkislandnationalpark.gov.au,https://pulukeelingnationalpark.gov.au,https://uluru.gov.au,https://cap-alerts-demo-aws.d2h57p6wt14r68.amplifyapp.com,https://cap-alerts-demo-drupal-module-2.d2h57p6wt14r68.amplifyapp.com,https://uat.davilgbirty04.amplifyapp.com,https://uat.d1npqk1l166f17.amplifyapp.com,https://uat.d2g0mxu9kcaqnb.amplifyapp.com,https://uat.dim4b3g9iqip6.amplifyapp.com,https://uat.dke1mp1s0t89i.amplifyapp.com,https://uat.dm6pqafx31hva.amplifyapp.com,https://uat.do1ly7mvyztbf.amplifyapp.com,https://uat.devi5m4tlwdbg.amplifyapp.com,https://uat.dj1hcc67w9rtp.amplifyapp.com\" DrupalFeedSourcesUrl=\"https://demo3-parksaustralia-cms.pantheonsite.io/api/cap-alerts/feed-sources/\" DrupalAggregatorSecretSsmParameter=\"/parks/test/cap-aggregator/drupal-connector-secret\" PollSchedule=\"rate(1 minute)\""
image_repositories = []
disable_rollback = true
