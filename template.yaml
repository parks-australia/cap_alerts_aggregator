AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Parks Australia CAP alert aggregator

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        AWS_SAM_FEED_STATE_TABLE: !Ref FeedStateTable
        AWS_SAM_OUTPUT_BUCKET: !Ref OutputBucket
        DRUPAL_FEED_SOURCES_URL: !Ref DrupalFeedSourcesUrl
        AWS_SAM_DRUPAL_AGGREGATOR_SECRET_SSM_PARAMETER: !Ref DrupalAggregatorSecretSsmParameter
        BOUNDARIES_DIR: assets/boundary_data

Parameters:
  DrupalFeedSourcesUrl:
    Type: String
  DrupalAggregatorSecretSsmParameter:
    Type: String
    Description: Name of the AWS SSM SecureString containing the Drupal connector shared secret.
  PollSchedule:
    Type: String
    Default: rate(1 minute)

Resources:
  AggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedStateTable
        - S3WritePolicy:
            BucketName: !Ref OutputBucket
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: "*"
      Events:
        PollSchedule:
          Type: Schedule
          Properties:
            Schedule: !Ref PollSchedule
            Enabled: true

  FeedStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: state_key
          AttributeType: S
      KeySchema:
        - AttributeName: state_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  AggregatorFunction:
    Value: !GetAtt AggregatorFunction.Arn
  OutputBucket:
    Value: !Ref OutputBucket
